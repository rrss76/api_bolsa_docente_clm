name: Pipeline Automatico CLM (prueba)

# ─────────────────────────────────────────────────────────────────────────
# Este workflow ejecuta el pipeline completo (scraper + parsers + carga)
# dentro del runner de GitHub Actions y, si hay datos nuevos, comitea la BD
# actualizada a la rama TARGET_BRANCH (ver `env` justo debajo).
#
# MODO PRUEBA (estado actual): TARGET_BRANCH=automation-test y
# NOTIFICAR="false". Comitea a una rama que Render NUNCA despliega y no envía
# ninguna notificación, así que producción no corre ningún riesgo.
#
# El disparo lo hace cron-job.org (jueves cada hora, viernes cada 15 min)
# llamando a la API de workflow_dispatch; el `schedule:` de GitHub queda como
# respaldo (GitHub lo retrasa o se lo salta con frecuencia).
#
# PARA PASAR A PRODUCCIÓN (todos los pasos son necesarios):
#   1. Copiar `estado_scraper.json` de automation-test a main (comiteado).
#      Sin él, el primer disparo tomaría por nuevos los PDFs que ya cargaste
#      a mano y los volvería a añadir a las tablas acumulativas.
#   2. Crear el secreto FIREBASE_SERVICE_ACCOUNT_JSON en
#      Settings > Secrets and variables > Actions (el mismo JSON que en Render).
#   3. Cambiar abajo TARGET_BRANCH a "main" y NOTIFICAR a "true".
#   4. Acordar que las cargas manuales pasan a ser solo de respaldo, y hacer
#      `git pull` antes de cualquiera: cargar a mano encima de una BD ya
#      cargada por el pipeline duplica filas en las tablas acumulativas.
# ─────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "7 10-14 * * 4"             # Jueves, 1 vez/hora, 12:07-16:07h española (UTC+2 verano)
    - cron: "3,18,33,48 10-14 * * 5"    # Viernes, cada 15 min, 12:03-16:48h española (UTC+2 verano)
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar re-descarga aunque ya existan los PDFs"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  TARGET_BRANCH: automation-test
  NOTIFICAR: "false"

permissions:
  contents: write

# Evita que dos ejecuciones se solapen y choquen al hacer push a la vez
# -- si una ya esta en marcha, la siguiente espera en cola.
concurrency:
  group: pipeline-automatico
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Margen para la espera a que Render despliegue antes de notificar.
    timeout-minutes: 35
    env:
      # La BD (~160 MB) NO se descarga en el checkout: solo se baja de LFS
      # cuando hay datos nuevos que cargar (ver asegurar_bd_descargada en
      # 4_Cargador_Semanal.py). Evita gastar la cuota de ancho de banda de
      # LFS en cada disparo del cron.
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Checkout de ${{ env.TARGET_BRANCH }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          lfs: false

      - name: Configurar Git LFS
        run: git lfs install

      # La rama de destino solo debe aportar la BD y el estado; el codigo se
      # toma siempre de main para no ejecutar copias antiguas (--worktree: no
      # se anade al indice, asi que no acaba en el commit de la BD). Si el
      # destino es main, no hace nada.
      - name: Usar el codigo mas reciente de main
        run: |
          git fetch origin main
          git restore --source=origin/main --worktree -- \
            scraper.py run_pipeline.py push_notifications.py notificar.py \
            2_Parser_Disponibles_auto.py 3_Parser_Adjudicaciones_auto.py \
            4_Cargador_Semanal.py requirements.txt

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar usuario de Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # La notificacion NO la envia run_pipeline: se manda despues, cuando la
      # API ya sirve los datos nuevos (paso de notificacion, mas abajo).
      - name: Ejecutar pipeline
        run: |
          ARGS="--sin-notificar"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python run_pipeline.py $ARGS

      - name: Comitear BD actualizada (si hay cambios)
        id: commit
        run: |
          git add -f Base_Bolsa_Docente.db
          if [ -f estado_scraper.json ]; then git add -f estado_scraper.json; fi
          if git diff --cached --quiet; then
            echo "Sin cambios que comitear."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "auto: actualizacion de datos $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:${{ env.TARGET_BRANCH }}
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Solo en produccion: espera a que Render sirva la fecha nueva y avisa.
      - name: Notificar a la app cuando la API ya sirve los datos
        if: ${{ env.NOTIFICAR == 'true' && steps.commit.outputs.pushed == 'true' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python notificar.py
