name: Pipeline Automatico CLM (prueba)

# ─────────────────────────────────────────────────────────────────────────
# MODO PRUEBA (activo desde 2026-09-04): este workflow ejecuta el pipeline
# completo (scraper + parsers + carga) dentro del propio runner de GitHub
# Actions y, si hay novedades, comitea la base de datos actualizada a la
# rama `automation-test` — NUNCA a `main`, así que nunca toca producción
# ni dispara un redeploy en Render.
#
# Tras 2 semanas de disparos manuales limpios (05/09 y 11/09, contenido
# identico byte a byte contra la carga manual), desde el 2026-09-13 el
# `schedule:` esta activo para probar tambien el disparo automatico --
# pero sigue apuntando solo a `automation-test`, asi que produccion no
# corre ningun riesgo.
#
# Cuando se confirme que el pipeline es fiable de forma desatendida:
#   1. Cambiar `ref: automation-test` por `ref: main` en el paso de checkout
#      y en el paso de push, para que comitee a producción de verdad.
#   2. Quitar "(prueba)" del nombre del workflow si se quiere.
# ─────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "7 10-14 * * 4"             # Jueves, 1 vez/hora, 12:07-16:07h española (UTC+2 verano)
    - cron: "3,18,33,48 10-14 * * 5"    # Viernes, cada 15 min, 12:03-16:48h española (UTC+2 verano)
                                          # Minutos desplazados (no :00/:15/:30/:45 exactos) para evitar
                                          # la hora punta de GitHub Actions, ver nota mas abajo
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar re-descarga aunque ya existan los PDFs"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

# Evita que dos ejecuciones se solapen y choquen al hacer push a la vez
# a automation-test -- si una ya esta en marcha, la siguiente espera en
# cola en vez de arrancar en paralelo.
concurrency:
  group: pipeline-automatico-automation-test
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # La BD (~160 MB) NO se descarga en el checkout: solo se baja de LFS
      # cuando hay datos nuevos que cargar (ver asegurar_bd_descargada en
      # 4_Cargador_Semanal.py). Evita gastar la cuota de ancho de banda de
      # LFS en cada disparo del cron.
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Checkout rama de prueba (automation-test)
        uses: actions/checkout@v4
        with:
          ref: automation-test
          lfs: false

      - name: Configurar Git LFS
        run: git lfs install

      # La rama automation-test solo debe aportar la BD y el estado; el codigo
      # se toma siempre de main para no ejecutar copias antiguas (--worktree:
      # no se anade al indice, asi que no acaba en el commit de la BD).
      - name: Usar el codigo mas reciente de main
        run: |
          git fetch origin main
          git restore --source=origin/main --worktree -- \
            scraper.py run_pipeline.py push_notifications.py \
            2_Parser_Disponibles_auto.py 3_Parser_Adjudicaciones_auto.py \
            4_Cargador_Semanal.py requirements.txt

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar usuario de Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ejecutar pipeline (BD de prueba, sin notificacion push)
        run: |
          ARGS="--db Base_Bolsa_Docente.db"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python run_pipeline.py $ARGS

      - name: Comitear BD actualizada (si hay cambios)
        run: |
          git add -f Base_Bolsa_Docente.db estado_scraper.json
          if git diff --cached --quiet; then
            echo "Sin cambios que comitear."
          else
            git commit -m "test: actualizacion automatica pipeline $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:automation-test
          fi
